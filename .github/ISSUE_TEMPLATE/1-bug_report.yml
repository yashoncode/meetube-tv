name: Bug report
description: Something in MeeTube TV doesn't work
title: "[Bug]: "
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a MeeTube TV bug. On a phone or tablet? Report it in [MeeTube's tracker](https://github.com/yashoncode/meetube/issues/new/choose).

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: "I searched the [open and closed issues](https://github.com/yashoncode/meetube-tv/issues?q=is%3Aissue) and this isn't there yet."
          required: true
        - label: "This issue is about one bug."
          required: true

  - type: input
    id: app-version
    attributes:
      label: MeeTube TV version
      description: Settings → About.
      placeholder: "1.1.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: TV or box, and Android version
      placeholder: "Mi Box S, Android 9 / Chromecast with Google TV, Android 14"
    validations:
      required: true

  - type: dropdown
    id: signed-in
    attributes:
      label: Signed in to a Google account?
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. Paste any error message word for word.
      placeholder: |
        1. Opened a video from Subscriptions
        2. After about a minute it stopped with "Unknown source error"
    validations:
      required: true

  - type: input
    id: video
    attributes:
      label: Video link
      description: If it happens with a particular video.
      placeholder: "https://youtu.be/..."

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A photo or video of the screen helps a lot.
